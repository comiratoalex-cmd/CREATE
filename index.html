<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>COMIAL PRO</title>

<style>
/* =====================
   ROOT VARIABLES
===================== */
:root{
  --neon:#9b6cff;
  --glow:40px;
  --pulseSpeed:2.5s;
}

/* =====================
   RESET
===================== */
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#000;
  color:#fff;
  font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
  display:flex;
  height:100vh;
  overflow:hidden;
}

/* =====================
   PANEL UI
===================== */
.panel{
  width:280px;
  background:#0b0b0b;
  border-right:1px solid #1a1a1a;
  padding:20px;
}

.panel h1{
  font-size:24px;
  margin-bottom:20px;
}

.panel button,
.panel input{
  width:100%;
  margin-bottom:14px;
}

.panel button{
  padding:12px;
  border-radius:10px;
  border:none;
  background:linear-gradient(90deg,#7f6cff,#00eaff);
  color:#000;
  font-weight:700;
  cursor:pointer;
}

.panel label{
  font-size:14px;
  opacity:.8;
}

.presets{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.presets button{
  flex:1;
  background:#111;
  color:#fff;
  border:1px solid #222;
}

/* =====================
   OVERLAY
===================== */
.stage{
  flex:1;
  position:relative;
}

.overlay{
  position:absolute;
  right:40px;
  top:40px;
  width:420px;
  height:720px;
  border-radius:18px;
  border:4px solid var(--neon);
  box-shadow:
    0 0 calc(var(--glow) * 0.5) var(--neon),
    0 0 var(--glow) var(--neon);
}

.overlay-label{
  position:absolute;
  top:10px;
  left:12px;
  font-size:14px;
  opacity:.7;
}

/* =====================
   PULSE
===================== */
.pulse-on{
  animation:pulseGlow var(--pulseSpeed) infinite ease-in-out;
}

@keyframes pulseGlow{
  0%{
    box-shadow:
      0 0 calc(var(--glow) * 0.4) var(--neon),
      0 0 var(--glow) var(--neon);
  }
  50%{
    box-shadow:
      0 0 calc(var(--glow) * 1.2) var(--neon),
      0 0 calc(var(--glow) * 2) var(--neon);
  }
}

/* =====================
   OBS MODE
===================== */
.obs-mode .panel{
  display:none;
}
</style>
</head>

<body>

<!-- =====================
     UI PANEL
===================== -->
<div class="panel">
  <h1>COMIAL PRO</h1>

  <button id="btnAI">🎨 Gerar Tema IA</button>

  <label>Glow</label>
  <input id="glowRange" type="range" min="10" max="140" value="40">

  <label>Velocidade do Pulso</label>
  <input id="pulseSpeed" type="range" min="1" max="6" step="0.5" value="2.5">

  <button id="btnPulse">⚡ Pulso ON / OFF</button>

  <div class="presets">
    <button data-theme="tokyo">Tokyo</button>
    <button data-theme="aurora">Aurora</button>
    <button data-theme="pastel">Pastel</button>
  </div>

  <button id="btnOBS">🎥 OBS MODE</button>
</div>

<!-- =====================
     OVERLAY STAGE
===================== -->
<div class="stage">
  <div id="overlay" class="overlay pulse-on">
    <span class="overlay-label">OVERLAY ATIVO</span>
  </div>
</div>

<script>
/* =====================
   STATE
===================== */
const state = {
  neon:'#9b6cff',
  glow:40,
  pulse:true,
  speed:2.5,
  obs:false
};

const root = document.documentElement;
const overlay = document.getElementById('overlay');

/* =====================
   ELEMENTS
===================== */
const glowRange = document.getElementById('glowRange');
const pulseSpeed = document.getElementById('pulseSpeed');
const btnPulse = document.getElementById('btnPulse');
const btnAI = document.getElementById('btnAI');
const btnOBS = document.getElementById('btnOBS');

/* =====================
   APPLY STATE
===================== */
function apply(){
  root.style.setProperty('--neon',state.neon);
  root.style.setProperty('--glow',state.glow+'px');
  root.style.setProperty('--pulseSpeed',state.speed+'s');

  overlay.classList.toggle('pulse-on',state.pulse);
  document.body.classList.toggle('obs-mode',state.obs);

  localStorage.setItem('comial-pro',JSON.stringify(state));
}

/* =====================
   EVENTS
===================== */
glowRange.oninput = e=>{
  state.glow=e.target.value;
  apply();
};

pulseSpeed.oninput = e=>{
  state.speed=e.target.value;
  apply();
};

btnPulse.onclick=()=>{
  state.pulse=!state.pulse;
  apply();
};

btnOBS.onclick=()=>{
  state.obs=!state.obs;
  apply();
};

btnAI.onclick=()=>{
  const colors=[
    '#9b6cff',
    '#00eaff',
    '#ff4ecd',
    '#7cff00',
    '#ffaa00'
  ];
  state.neon=colors[Math.floor(Math.random()*colors.length)];
  apply();
};

document.querySelectorAll('.presets button').forEach(btn=>{
  btn.onclick=()=>{
    const t=btn.dataset.theme;
    if(t==='tokyo') state.neon='#00eaff';
    if(t==='aurora') state.neon='#7cffc7';
    if(t==='pastel') state.neon='#ffb7ff';
    apply();
  };
});

/* =====================
   LOAD
===================== */
const saved=localStorage.getItem('comial-pro');
if(saved) Object.assign(state,JSON.parse(saved));
apply();
</script>

</body>
</html>
