<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>COMIAL PRO</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/panel.css">
  <link rel="stylesheet" href="css/overlay.css">
</head>
<body>

<!-- PAINEL -->
<div class="panel">
  <h1>COMIAL PRO</h1>

  <label>Intensidade do Glow</label>
  <input id="glowRange" type="range" min="10" max="160" value="60">

  <label>Velocidade do Pulso</label>
  <input id="speedRange" type="range" min="1" max="8" step="0.5" value="3">

  <button id="btnPulse">⚡ Pulso ON / OFF</button>

  <div class="presets">
    <button data-preset="tokyo">Tokyo</button>
    <button data-preset="aurora">Aurora</button>
    <button data-preset="pastel">Pastel</button>
    <button data-preset="cyber">Cyber</button>
    <button data-preset="soft">Soft</button>
  </div>

  <button id="btnOBS">🎥 OBS MODE</button>
</div>

<!-- OVERLAY -->
<div class="stage">
  <div id="overlay" class="overlay pulse-on">
    <span class="overlay-label">OVERLAY ATIVO</span>
  </div>
</div>

<script src="js/presets.js"></script>
<script src="js/main.js"></script>
</body>
</html>
